{% extends "app/base/base_docente.html" %}

{% block titulo %} Editar Asistencia {% endblock %}
{% block content %}

<form action="{% url 'editar_control_asistencia' asistencia.id %}" method="post">
    {% csrf_token %}
    <table class="table">
        <thead>
            <tr>
                <th scope="col">Alumno</th>
                <th scope="col" class="text-center">Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for x in asistencias_alumno %}
            <tr>
                <td>{{ x.id_alumno.nombre }} {{ x.id_alumno.apellido }}</td> 
                <td class="text-center">
                    <input type="radio" name="estado_{{ x.id_alumno.id }}" value="presente" 
                           {% if x.estado == 'presente' %}checked{% endif %} required> Presente
                    <input type="radio" name="estado_{{ x.id_alumno.id }}" value="ausente" 
                           {% if x.estado == 'ausente' %}checked{% endif %} required> Ausente
                    <input type="radio" name="estado_{{ x.id_alumno.id }}" value="tarde" 
                           {% if x.estado == 'tarde' %}checked{% endif %} required> Tarde
                </td>
                <td>
                    <input type="hidden" name="alumno_id_{{ x.id_alumno.id }}" value="{{ x.id_alumno.id }}">
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <div class="d-grid gap-2">
        <button class="btn btn-warning" type="submit"><i class="bi bi-check-circle"></i> Guardar Cambios</button>
    </div>
</form>

{% endblock %}
