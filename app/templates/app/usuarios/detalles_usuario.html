{% extends "app/dashboard/dashboard_admin.html" %}

{% block option %}
Gestión de Usuarios
{% endblock %}

{% block buscar %}

<form class="d-flex" role="search" method="GET" action="{% url 'buscar_usuarios' %}">
    <input class="form-control me-2" type="search" name="q" placeholder="Buscar Usuarios" aria-label="Search"
        value="{{ query }}">
    <button class="btn btn-outline-success" type="submit">Buscar</button>
</form>

{% endblock %}

{% block subtitle %} Detalles Usuario {% endblock %}

{% block content %}
<div style="width: 80%; padding-left: 20%;">
    <div class="mb-3">
      <label class="form-label">Nombre de Usuario</label>
      <input type="text" class="form-control" name="usuario" placeholder="Ingrese el nombre de Usuario" value="{{usuario.username}}" disabled>
    </div>
    <div class="mb-3">
      <label class="form-label">Contraseña</label>
      <input type="password" class="form-control" name="contraseña" placeholder="Ingrese la contraseña" value="{{usuario.password}}" disabled>
    </div>
    <div class="mb-3">
      <label class="form-label">Grupo</label>
      <select class="form-select" aria-label="Default select example" name="grupo" disabled>
        {% for grupo in grupos %}
        <option value="{{ grupo.name }}" {% if grupo.name == nombre_grupo %}selected{% endif %}>
            {{ grupo.name }}
        </option>
    {% endfor %}
      </select>
    </div>
    <div class="d-grid gap-2">
        <a href="/lista_usuarios/" class="btn btn-primary">Volver a lista</a>
      </div>

  
</div>
{% endblock %}
